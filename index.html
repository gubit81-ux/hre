<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            overflow: hidden;
        }

        .calculator {
            background-color: #22252d;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 340px;
            z-index: 1;
        }

        #display {
            width: 100%;
            height: 80px;
            background-color: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px 20px;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 50%;
            border: none;
            outline: none;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-number {
            background-color: #292d36;
            color: #ffffff;
        }
        .btn-number:hover {
            background-color: #353a46;
        }

        .btn-operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-operator:hover {
            background-color: #cc7f08;
        }

        .btn-function {
            background-color: #a5a5a5;
            color: #000000;
        }
        .btn-function:hover {
            background-color: #d4d4d2;
        }

        .btn-equal {
            background-color: #26d366;
            color: #ffffff;
            border-radius: 40px;
            grid-column: span 2;
        }
        .btn-equal:hover {
            background-color: #1ea851;
        }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: black;
            z-index: 9999;
        }

        #video-overlay.is-open {
            display: block;
        }

        #fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #close-video-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            background-color: #d13438;
            border: none;
            color: white;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 10000;
        }

        #close-video-btn.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        
        <div class="buttons">
            <button class="btn-function" onclick="clearDisplay()">C</button>
            <button class="btn-function" onclick="deleteLast()">⌫</button>
            <button class="btn-function" onclick="appendValue('%')">%</button>
            <button class="btn-operator" onclick="appendValue('/')">÷</button>

            <button class="btn-number" onclick="appendValue('7')">7</button>
            <button class="btn-number" onclick="appendValue('8')">8</button>
            <button class="btn-number" onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('*')">×</button>

            <button class="btn-number" onclick="appendValue('4')">4</button>
            <button class="btn-number" onclick="appendValue('5')">5</button>
            <button class="btn-number" onclick="appendValue('6')">6</button>
            <button class="btn-operator" onclick="appendValue('-')">-</button>

            <button class="btn-number" onclick="appendValue('1')">1</button>
            <button class="btn-number" onclick="appendValue('2')">2</button>
            <button class="btn-number" onclick="appendValue('3')">3</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>

            <button class="btn-number" onclick="appendValue('0')">0</button>
            <button class="btn-number" onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <div id="video-overlay">
        <button id="close-video-btn" type="button">Close</button>
        <video id="fullscreen-video" playsinline preload="auto">
            <source id="video-source" src="gr.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        'use strict';
        const display = document.getElementById('display');
        const VIDEO_FILES = ['gr.mp4', 'Ya.mp4', 'Yo.mp4'];
        const videoOverlay = document.getElementById('video-overlay');
        const video = document.getElementById('fullscreen-video');
        const videoSource = document.getElementById('video-source');
        const closeVideoBtn = document.getElementById('close-video-btn');

        let isVideoLocked = false;

        VIDEO_FILES.forEach(function (file) {
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'video';
            preload.href = file;
            document.head.appendChild(preload);
        });
        
        const availableVideos = [];
        let checkedCount = 0;

        function finishVideoCheck() {
            checkedCount += 1;
            if (checkedCount === VIDEO_FILES.length && availableVideos.length === 0) {
                availableVideos.push('gr.mp4');
            }
        }

        VIDEO_FILES.forEach(function (file) {
            const test = document.createElement('video');
            test.preload = 'metadata';
            test.src = file;
            test.onloadedmetadata = function () {
                availableVideos.push(file);
                finishVideoCheck();
            };
            test.onerror = finishVideoCheck;
        });

        function pickRandomVideo() {
            const pool = availableVideos.length > 0 ? availableVideos : ['gr.mp4'];
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function openVideo() {
            const chosen = pickRandomVideo();

            try {
                if (videoSource.getAttribute('src') !== chosen) {
                    videoSource.setAttribute('src', chosen);
                    video.load();
                } else {
                    video.currentTime = 0;
                }
            } catch (error) {
            }

            closeVideoBtn.classList.remove('show');
            videoOverlay.classList.add('is-open');
            isVideoLocked = true;

            const playPromise = video.play();
            if (playPromise && playPromise.catch) {
                playPromise.catch(function () {
                    closeVideoBtn.classList.add('show');
                });
            }
        }

        function closeVideo() {
            if (isVideoLocked) return;
            videoOverlay.classList.remove('is-open');
            try { video.pause(); } catch (error) {}
        }

        let pendingResult = null;

        video.addEventListener('ended', function () {
            isVideoLocked = false;
            closeVideoBtn.classList.add('show');
            if (pendingResult !== null) {
                display.value = pendingResult;
                pendingResult = null;
            }
        });

        video.addEventListener('error', function () {
            isVideoLocked = false;
            closeVideoBtn.classList.add('show');
        });

        closeVideoBtn.addEventListener('click', closeVideo);

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && videoOverlay.classList.contains('is-open')) {
                event.preventDefault();
            }
        });
        
        function appendValue(value) {
            if (display.value === '0' && !isNaN(value)) {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0';
            }
        }

        function calculate() {
            openVideo();
            try {
                let expression = display.value.replace(/%/g, '/100');
                let result = eval(expression);
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(8));
                }
                pendingResult = result;
            } catch (error) {
                display.value = 'Error';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>

</body>
</html>
